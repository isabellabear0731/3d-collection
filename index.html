<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 大人の図鑑シール｜收藏图鉴</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#242424;--muted:#777;--line:#e8e5dd;--accent:#466b60}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:34px 22px 22px;max-width:1180px;margin:auto}h1{font-size:clamp(25px,4vw,38px);margin:0 0 7px}header p{color:var(--muted);margin:0;max-width:760px}
.wrap{max-width:1180px;margin:auto;padding:0 22px 48px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0 20px}.toolbar input,.toolbar select{border:1px solid var(--line);background:white;border-radius:10px;padding:11px 13px;font:inherit}.toolbar input{flex:1;min-width:210px}.count{color:var(--muted);font-size:13px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column;min-width:0}.photo{height:290px;background:#f0efeb;display:flex;align-items:center;justify-content:center;padding:10px}.photo a{display:flex;width:100%;height:100%;min-height:0;align-items:center;justify-content:center}.photo img{display:block;max-height:100%;max-width:100%;width:100%;height:100%;object-fit:contain}.missing{color:#888;text-align:center;padding:20px;font-size:13px}.missing b{display:block;font-size:28px;color:#bbb;margin-bottom:8px}.info{padding:13px 14px 15px;display:flex;flex-direction:column;gap:5px;flex:1}.title{font-weight:700;font-size:16px}.jp{font-size:13px;color:#666}.meta{font-size:12px;color:#888}.tag{display:inline-block;background:#edf2ef;color:#47675d;padding:3px 7px;border-radius:20px;font-size:11px;width:max-content}.check{margin-top:7px;font-size:13px;color:#555}.price-box{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);display:grid;gap:6px}.price-label{font-size:12px;color:#777}.price-controls{display:flex;gap:5px;min-width:0}.price-controls input,.price-controls select{min-width:0;width:100%;padding:7px 6px;border:1px solid var(--line);border-radius:7px;background:#fff;font:inherit;font-size:12px}.price-controls input{flex:1}.price-controls select{width:70px;flex:0 0 70px}
.price-conversions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:2px}
.fx-cell{min-width:0;padding:7px 6px;border:1px solid #eeeae3;border-radius:8px;background:#faf9f6;text-align:center}
.fx-cell.primary{background:#edf3f0;border-color:#cddbd5}
.fx-code{display:block;font-size:10px;letter-spacing:.04em;color:#8a8983;font-weight:650}
.fx-value{display:block;font-size:12px;font-weight:650;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.fx-cell.primary .fx-value{font-size:14px;color:#365d51}
.fx-hint{font-size:10px;color:#999;line-height:1.3}
.price-actions{display:flex;align-items:center;gap:7px}.price-actions button{border:0;border-radius:7px;padding:6px 10px;background:var(--accent);color:#fff;font:inherit;font-size:12px}.price-saved{font-size:12px;color:#47675d}.price-clear{border:0;background:transparent;color:#888;font:inherit;font-size:11px;padding:4px}.card.bonbon-card{border-color:#e6dce9;box-shadow:0 3px 12px rgba(75,55,90,.045)}.bonbon-card .photo{height:320px;background:linear-gradient(145deg,#f7f0fa 0%,#f4f3fb 52%,#fff4f1 100%);padding:12px}.bonbon-card .photo a{padding:2px}.bonbon-card .photo img{object-fit:contain;filter:drop-shadow(0 5px 7px rgba(48,35,65,.12));transition:transform .2s ease}.bonbon-card .photo a:hover img{transform:scale(1.025)}.bonbon-card .info{gap:7px;padding:14px 15px 16px}.bonbon-card .tag{background:#f3eaf6;color:#76567d;font-size:11px;letter-spacing:.01em}.bonbon-card .title{font-size:17px;line-height:1.35;min-height:2.7em;overflow-wrap:anywhere}.bonbon-card .jp{font-size:12px;color:#8b7b8d}.bonbon-card .meta{font-size:11px}.bonbon-card .check{padding:8px 0 2px;border-top:1px solid #f0eaf1;margin-top:5px}.bonbon-card .price-box{margin-top:7px;border-top:1px solid #eee6ef}.bonbon-card .price-actions button{background:#765b7c}.bonbon-card .price-saved{display:block;flex-basis:100%;padding-top:3px}.bonbon-card .price-actions{flex-wrap:wrap}.wish-section{margin:30px 0}.wish-section h2{font-size:22px;margin:0 0 6px}.wish-section p{color:var(--muted);font-size:13px;margin:0 0 14px}.wish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.wish-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.wish-card img{display:block;width:100%;height:310px;object-fit:contain;background:#f1f0ec;padding:8px}.wish-card div{padding:10px 12px;font-weight:650;font-size:14px}.wish-card small{display:block;color:#888;font-weight:400;margin-top:3px}.note{background:#fff;border:1px solid var(--line);padding:14px 16px;border-radius:12px;margin:18px 0 22px;color:#666;font-size:13px}
@media(max-width:699px){header{padding-top:22px}.wrap{padding-left:14px;padding-right:14px}}
footer{max-width:1180px;margin:auto;padding:0 22px 35px;color:#888;font-size:12px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:220px}.bonbon-card .photo{height:250px}.bonbon-card .info{padding:10px}.bonbon-card .title{font-size:14px;min-height:2.7em}.price-conversions{gap:4px}.fx-cell{padding:6px 3px}.fx-value{font-size:11px}.fx-cell.primary .fx-value{font-size:12px}.info{padding:10px}.title{font-size:14px}}
</style></head><body>
<header><h1>3D 大人の図鑑シール</h1><p>个人收藏图鉴 · KAMIO JAPAN 大人の図鑑シール + Disney Bonbon Drop。使用系列筛选查看，所有商品均可收藏和记录购买价格。</p></header>
<main class="wrap">
<div class="note">图片保存在网站本地 images 文件夹中。收藏状态和购买价格保存在当前浏览器，不同设备之间不会自动同步。</div>
<div class="toolbar"><input id="q" placeholder="搜索中文主题、日文名称或商品编号…"><select id="category"><option value="all">全部系列</option><option value="adult">大人の図鑑シール</option><option value="bonbon">Bonbon Drop</option><option value="main">Bonbon · Main Wishlist</option><option value="conditional">Bonbon · Conditional Wishlist</option></select><select id="batch"><option value="all">全部批次</option><option value="1">第一批 · 6款</option><option value="2">第二批 · 6款</option><option value="3">第三批 · 9款</option></select><span class="count" id="count"></span></div><div class="note" id="sync-status" role="status">收藏状态和购买价格仅保存在当前设备的浏览器中</div>
<div class="grid" id="grid"></div>
</main><footer>非官方个人收藏索引。商品图片版权归 KAMIO JAPAN 及相关权利人所有。</footer>
<script>
const adultItems=[{code:'228126',batch:1,zh:'怀旧文具',jp:'懐かしい文房具編',img:'images/228126.jpg'},
{code:'228127',batch:1,zh:'矿物',jp:'鉱物編',img:'images/228127.jpg'},
{code:'228128',batch:1,zh:'雪之妖精（长尾山雀）',jp:'シマエナガ編',img:'images/228128.jpg'},
{code:'228129',batch:1,zh:'天体',jp:'天体編',img:'images/228129.jpg'},
{code:'228130',batch:1,zh:'鸡尾酒',jp:'カクテル編',img:'images/228130.jpg'},
{code:'228131',batch:1,zh:'海洋生物',jp:'海洋生物編',img:'images/228131.jpg'},
{code:'231212',batch:2,zh:'古代埃及',jp:'古代エジプト編',img:'images/231212.jpg'},
{code:'231213',batch:2,zh:'超市',jp:'スーパー編',img:'images/231213.jpg'},
{code:'231214',batch:2,zh:'面包',jp:'パン編',img:'images/231214.jpg'},
{code:'231215',batch:2,zh:'矿物 2',jp:'鉱物編2',img:'images/231215.jpg'},
{code:'231216',batch:2,zh:'水母',jp:'クラゲ編',img:'images/231216.jpg'},
{code:'231217',batch:2,zh:'海蛞蝓',jp:'ウミウシ編',img:'images/231217.jpg'},
{code:'233527',batch:3,zh:'牙齿',jp:'歯編',img:'images/233527.jpg'},
{code:'233528',batch:3,zh:'乐器',jp:'楽器編',img:'images/233528.jpg'},
{code:'233529',batch:3,zh:'昆虫',jp:'昆虫編',img:'images/233529.jpg'},
{code:'233530',batch:3,zh:'鸡蛋料理',jp:'卵料理編',img:'images/233530.jpg'},
{code:'233531',batch:3,zh:'面食',jp:'麺類編',img:'images/233531.jpg'},
{code:'233532',batch:3,zh:'复古咖啡厅',jp:'レトロ喫茶編',img:'images/233532.jpg'},
{code:'233533',batch:3,zh:'海豚与鲸鱼',jp:'イルカ・クジラ編',img:'images/233533.jpg'},
{code:'233534',batch:3,zh:'热带鱼',jp:'熱帯魚編',img:'images/233534.jpg'},
{code:'233535',batch:3,zh:'水族馆',jp:'水族館編',img:'images/233535.jpg'}].map(x=>({...x,id:'adult-'+x.code,series:'adult',seriesLabel:'大人の図鑑',group:'adult'}));
const bonbonDefs=[
['main-01','Zootopia','主 Wishlist','main'],['main-02','Zootopia Seal','主 Wishlist','main'],['main-03','Disney Princess','主 Wishlist','main'],['main-04','Disney Classics','主 Wishlist','main'],['main-05','Zootopia mini','主 Wishlist','main'],
['extra-01','Alice in Wonderland','Conditional Wishlist','conditional'],['extra-02','Stitch','Conditional Wishlist','conditional'],['extra-03','Monsters, Inc.','Conditional Wishlist','conditional'],['extra-04','Winnie the Pooh','Conditional Wishlist','conditional'],['extra-05','Alice in Wonderland mini','Conditional Wishlist','conditional'],['extra-06','Stitch mini','Conditional Wishlist','conditional'],['extra-07','Toy Story Alien mini','Conditional Wishlist','conditional']];
const bonbonItems=bonbonDefs.map(([key,name,label,group])=>({id:'bonbon-'+key,code:'BD-'+key.toUpperCase(),batch:0,zh:name,jp:'Disney Bonbon Drop',img:`images/wishlist-${key}.png`,series:'bonbon',seriesLabel:'Bonbon Drop',group,groupLabel:label}));
const items=[...adultItems,...bonbonItems];
const grid=document.getElementById('grid'),q=document.getElementById('q'),batch=document.getElementById('batch'),category=document.getElementById('category'),count=document.getElementById('count'),statusEl=document.getElementById('sync-status');
const localKey='zukan-owned',priceKey='zukan-item-prices-v1';
const readLocal=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch{return fallback}};
let owned=readLocal(localKey,[]),prices=readLocal(priceKey,{});
function setStatus(msg){statusEl.textContent=msg}function saveOwned(){localStorage.setItem(localKey,JSON.stringify(owned));setStatus('✓ 收藏状态已保存在本设备')}function savePrices(){localStorage.setItem(priceKey,JSON.stringify(prices));setStatus('✓ 购买价格已保存在本设备')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const FX_TO_CNY={JPY:0.045,CNY:1,USD:6.67};
const currencyFmt=(value,code)=>new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(value);
function updateFxCard(id){
 const input=grid.querySelector(`[data-price-input="${id}"]`);
 const select=grid.querySelector(`[data-price-currency="${id}"]`);
 const panel=grid.querySelector(`[data-fx="${id}"]`);
 if(!input||!select||!panel)return;
 const amount=Number(input.value),valid=input.value.trim()!==''&&Number.isFinite(amount)&&amount>=0;
 const currency=select.value;
 const cny=valid?amount*FX_TO_CNY[currency]:null;
 const values={JPY:valid?cny/FX_TO_CNY.JPY:null,CNY:cny,USD:valid?cny/FX_TO_CNY.USD:null};
 panel.querySelectorAll('.fx-cell').forEach(cell=>{
   const code=cell.querySelector('.fx-code').textContent;
   cell.classList.toggle('primary',code===currency);
   cell.querySelector('.fx-value').textContent=valid?`${currencyFmt(values[code],code)} ${code}`:'—';
 });
}
function render(){let term=q.value.trim().toLowerCase(),cat=category.value,b=batch.value;let list=items.filter(x=>(cat==='all'||(cat==='adult'&&x.series==='adult')||(cat==='bonbon'&&x.series==='bonbon')||(cat==='main'&&x.group==='main')||(cat==='conditional'&&x.group==='conditional'))&&(b==='all'||x.series!=='adult'||String(x.batch)===b)&&(!term||[x.code,x.zh,x.jp,x.seriesLabel,x.groupLabel||''].join(' ').toLowerCase().includes(term)));
let totalOwned=items.filter(x=>owned.includes(x.id)||owned.includes(x.code)).length;count.textContent=`已收藏 ${totalOwned} / ${items.length} 款 · 显示 ${list.length} 款`;
grid.innerHTML=list.map(x=>{let price=prices[x.id]||prices[x.code]||{};let label=x.series==='adult'?`第 ${x.batch} 批`:`${x.groupLabel}`;return `<article class="card ${x.series==='bonbon'?'bonbon-card':''}"><div class="photo"><a href="${x.img}" target="_blank"><img loading="lazy" src="${x.img}" alt="${esc(x.zh)}"></a></div><div class="info"><span class="tag">${esc(x.seriesLabel)} · ${esc(label)}</span><div class="title">${esc(x.zh)}</div><div class="jp">${esc(x.jp)}</div><div class="meta">商品编号：${esc(x.code)}</div><label class="check"><input type="checkbox" data-id="${x.id}" ${owned.includes(x.id)||owned.includes(x.code)?'checked':''}> 已收藏</label><div class="price-box"><span class="price-label">购买价格 · 自动换算</span><div class="price-controls"><input type="number" min="0" step="0.01" inputmode="decimal" placeholder="输入金额" data-price-input="${x.id}" value="${price.amount??''}"><select data-price-currency="${x.id}"><option value="JPY" ${price.currency==='CNY'||price.currency==='USD'?'':'selected'}>JPY</option><option value="CNY" ${price.currency==='CNY'?'selected':''}>CNY</option><option value="USD" ${price.currency==='USD'?'selected':''}>USD</option></select></div><div class="price-conversions" data-fx="${x.id}"><div class="fx-cell primary"><span class="fx-code">JPY</span><span class="fx-value">—</span></div><div class="fx-cell"><span class="fx-code">CNY</span><span class="fx-value">—</span></div><div class="fx-cell"><span class="fx-code">USD</span><span class="fx-value">—</span></div></div><div class="fx-hint">固定参考汇率：1 USD = 6.67 CNY · 1 JPY = 0.045 CNY</div><div class="price-actions"><button type="button" data-price-save="${x.id}">保存价格</button>${price.amount!==undefined?`<span class="price-saved">已记录：${esc(price.amount)} ${esc(price.currency||'JPY')}</span>`:''}<button type="button" class="price-clear" data-price-clear="${x.id}">清除</button></div></div></div></article>`}).join('');
list.forEach(x=>updateFxCard(x.id));
grid.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('change',()=>{let id=el.dataset.id;owned=el.checked?[...new Set([...owned,id])]:owned.filter(v=>v!==id);saveOwned();render()}));
grid.querySelectorAll('[data-price-input]').forEach(el=>el.addEventListener('input',()=>updateFxCard(el.dataset.priceInput)));
grid.querySelectorAll('[data-price-currency]').forEach(el=>el.addEventListener('change',()=>updateFxCard(el.dataset.priceCurrency)));
grid.querySelectorAll('[data-price-save]').forEach(btn=>btn.addEventListener('click',()=>{let id=btn.dataset.priceSave,input=grid.querySelector(`[data-price-input="${id}"]`),currency=grid.querySelector(`[data-price-currency="${id}"]`).value;if(input.value.trim()===''||!Number.isFinite(Number(input.value))||Number(input.value)<0){alert('请输入有效的购买价格。');input.focus();return}prices[id]={amount:Number(input.value),currency};savePrices();render()}));
grid.querySelectorAll('[data-price-clear]').forEach(btn=>btn.addEventListener('click',()=>{delete prices[btn.dataset.priceClear];savePrices();render()}));}
q.addEventListener('input',render);batch.addEventListener('change',render);category.addEventListener('change',render);setStatus('收藏状态和购买价格仅保存在当前设备的浏览器中');render();
</script></body></html>
